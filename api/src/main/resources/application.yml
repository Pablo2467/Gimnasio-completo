spring:
  application:
    name: GymFlow

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/gymflow}
    username: ${DB_USERNAME:gymflow}
    password: ${DB_PASSWORD:gymflow123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:CAMBIA_ESTO_POR_UNA_CLAVE_LARGA_Y_ALEATORIA_DE_AL_MENOS_32_CARACTERES}
  access-token-expiration-ms: 900000      # 15 minutos
  refresh-token-expiration-ms: 604800000  # 7 días

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html